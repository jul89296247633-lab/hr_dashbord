# Конфигурация Supabase CLI — HR Control Tower
# Документация: https://supabase.com/docs/guides/cli/config

project_id = "hr-control-tower"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# PostgreSQL 17 (см. CLAUDE.md / SPEC Блок 0)
major_version = 17

[db.pooler]
enabled = false
port = 54329
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323

# Локальный почтовик для тестирования magic-link / подтверждений
[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Регистрация пользователей создаётся admin-ом через Dashboard,
# открытая самостоятельная регистрация отключена (см. SPEC роли).
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false
